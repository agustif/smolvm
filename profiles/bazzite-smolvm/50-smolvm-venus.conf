<?xml version="1.0" standalone="yes"?>
<!DOCTYPE driconf [
   <!ELEMENT driconf (device+)>
   <!ELEMENT device (application+)>
   <!ATTLIST device driver CDATA #IMPLIED>
   <!ELEMENT application (option+)>
   <!ATTLIST application name CDATA #REQUIRED
                         executable CDATA #IMPLIED
                         application_name_match CDATA #IMPLIED>
   <!ELEMENT option EMPTY>
   <!ATTLIST option name CDATA #REQUIRED value CDATA #REQUIRED>
]>
<!-- MoltenVK has no SYNC_FD. Mesa Venus then forces vkQueueWaitIdle
     before every present (vn_queue_wsi_present) and polls a fence
     feedback slot that never becomes guest-visible. Warzone hangs
     black on the first presentKHR. Implicit fencing skips that wait
     and uses the virtio-gpu BO submit instead. -->
<driconf>
    <device driver="venus">
        <application name="all" application_name_match=".*">
            <option name="venus_implicit_fencing" value="true" />
            <option name="vk_xwayland_wait_ready" value="false" />
        </application>
        <application name="Warzone2100" executable="warzone2100">
            <option name="venus_implicit_fencing" value="true" />
            <option name="vk_xwayland_wait_ready" value="false" />
        </application>
    </device>
</driconf>
